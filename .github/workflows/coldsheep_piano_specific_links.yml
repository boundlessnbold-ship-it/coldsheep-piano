name: Coldsheep Piano Process Specific Links

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: '처리할 유튜브 링크 (여러 개면 쉼표 또는 줄바꿈으로 구분)'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U --pre "yt-dlp[default]"

      - name: Install python deps
        run: pip install supabase requests numpy scipy tensorflow tensorflow-hub

      - name: 쿠키 파일 복원 (YTDLP_COOKIES_B64 secret이 있는 경우)
        working-directory: scripts
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
        run: |
          if [ -n "$YTDLP_COOKIES_B64" ]; then
            echo "$YTDLP_COOKIES_B64" | base64 -d > cookies.txt
            echo "cookies.txt 복원 완료"
          else
            echo "YTDLP_COOKIES_B64 secret 없음 - 쿠키 없이 진행"
          fi

      - name: 지정 링크만 처리
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_URLS: ${{ inputs.target_urls }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          YTDLP_COOKIES_FILE: cookies.txt
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_specific_links.py
