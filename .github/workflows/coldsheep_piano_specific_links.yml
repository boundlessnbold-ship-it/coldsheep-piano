name: Coldsheep Piano Process Specific Links

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: '처리할 유튜브 링크 (여러 개면 쉼표 또는 줄바꿈으로 구분)'
        required: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg, yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U yt-dlp

      - name: Install python deps
        working-directory: scripts
        run: pip install -r requirements.txt

      - name: 지정 링크만 처리
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_URLS: ${{ inputs.target_urls }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_specific_links.py
