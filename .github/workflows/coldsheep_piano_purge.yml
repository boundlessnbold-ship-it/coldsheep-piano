name: Coldsheep Piano Purge Old Storage
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '삭제 시작일 (포함, 예: 2025-04-01)'
        required: true
        default: '2025-04-01'
      end_date:
        description: '삭제 종료일 (미포함, 예: 2025-07-01 -> 2025년 4~6월 전체)'
        required: true
        default: '2025-07-01'
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install python deps
        run: pip install supabase
      - name: 지정 기간 영상 Storage 삭제 + 재처리 홀드
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PURGE_START_DATE: ${{ inputs.start_date }}
          PURGE_END_DATE: ${{ inputs.end_date }}
        run: python purge_old_storage.py
